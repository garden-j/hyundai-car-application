server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: practice-drive-backend

app:
  kakao:
    # developers.kakao.com 앱의 REST API 키(카카오모빌리티 길찾기 + 로컬 검색 공용)
    rest-api-key: ${KAKAO_REST_API_KEY:}
  kma:
    # 공공데이터포털 '기상청_단기예보 조회서비스' 일반 인증키(Decoding)
    service-key: ${KMA_SERVICE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health
